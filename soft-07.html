    <h1>截图与录屏工具：做教程、给客户演示用</h1>
    <p>带徒弟、给客户讲怎么操作，一张图或一段录屏比打十句话管用。</p>
    <h2>截图</h2>
    <ul>
      <li>系统自带截图快捷键就能截全屏/窗口；</li>
      <li>需要标注箭头、马赛克时，用带编辑的截图工具；</li>
      <li>截完直接粘贴进聊天框，别存一堆临时图。</li>
    </ul>
    <h2>录屏</h2>
    <blockquote>录操作教程时，鼠标放慢、口播清楚，重点步骤暂停一下。一段 1 分钟的录屏，胜过一页文字说明。</blockquote>
    <h2>原则</h2>
    <p>工具够用就行，别在截图软件上挑花眼。能快速截、能画箭头，就够了。</p>
