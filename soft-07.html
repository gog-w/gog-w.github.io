    <h1>北京精雕：灰度图转刀路与对刀找正</h1>
    <p>很多玉雕是拿一张灰度图（黑白深浅代表高低）直接转浮雕刀路。这步最容易出尺寸偏差。</p>
    <h2>灰度图</h2>
    <ul>
      <li>先定好成品尺寸，按比例缩放灰度图；</li>
      <li>黑=低、白=高，方向别反；</li>
      <li>浮雕深度按料厚设，别超过实际厚度。</li>
    </ul>
    <h2>对刀找正</h2>
    <blockquote>刀路编得再好，坐标偏了就废料。工件必须找正、对刀归零，首件空跑确认 Z 不下切台面。</blockquote>
    <h2>模拟</h2>
    <p>出机前一定在软件里仿真走一遍，看清有没有过切、漏雕，没问题再上机床。</p>
