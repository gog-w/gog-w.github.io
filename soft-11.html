    <h1>蜡模后处理：从打印件到可浇铸的合格蜡模</h1>
    <p>打印出来的树脂模不能直接浇，要经过处理。这几步漏了，铸件就废。</p>
    <h2>流程</h2>
    <ul>
      <li>清洗干净残留树脂；</li>
      <li>拆支撑，修补拆支撑留下的小坑；</li>
      <li>检查有没有层纹、缺料；</li>
      <li>组树时接好浇道水口。</li>
    </ul>
    <blockquote>树脂模和真蜡模烧失性不同，焙烧曲线要按树脂模调，别直接套蜡模参数，否则留残碳。</blockquote>
    <h2>检验</h2>
    <p>浇铸前对着光看一遍，有明显瑕疵就修，别抱侥幸。</p>
