    <h1>珠宝渲染出图：模型还没浇，先出产品效果图</h1>
    <p>客户要看效果再下单，不用先做实物。Rhino 模型直接渲染成图，省时省料。</p>
    <h2>怎么做</h2>
    <ul>
      <li>Rhino 模型调好材质：金属选金/银，宝石选对应折射率；</li>
      <li>打两盏柔光，出金属的高光和反光；</li>
      <li>背景干净，突出主体。</li>
    </ul>
    <blockquote>效果图是给客户看预期的，别渲染得比实物还完美，免得收到货觉得"图不对货"。留一点真实感。</blockquote>
    <h2>用途</h2>
    <p>效果图既能给客户确认款，也能直接当产品图上架，不用每件都实拍。</p>
