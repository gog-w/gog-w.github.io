    <h1>工艺参数怎么沉淀：笔记工具的选择</h1>
    <p>哪个树脂用什么曝光、失蜡焙烧到多少度——这些参数不记下来，下次还得重新试。</p>
    <h2>记什么</h2>
    <ul>
      <li>材料型号 + 对应的参数组合；</li>
      <li>试出来的结果：成功 / 失败、为什么；</li>
      <li>带个实测图，比纯文字直观。</li>
    </ul>
    <blockquote>笔记工具不重要，重要的是"随手记、能搜到"。别追求完美排版，先把参数留下来。</blockquote>
    <h2>定期整理</h2>
    <p>攒一个月，把好用的参数整理成自己的"工艺手册"，新人来了直接看，经验就不再只在一个人脑子里。</p>
