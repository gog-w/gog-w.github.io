    <h1>CorelDRAW 做珠宝铭牌、标签与包装排版</h1>
    <p>首饰做好了，配一张标签、一个包装盒，样子立刻专业。CDR 干这个最快。</p>
    <h2>常用物料</h2>
    <ul>
      <li>产品标签：品名、材质、圈号、价格；</li>
      <li>首饰盒腰封/封口贴；</li>
      <li>门店展板、九宫格陈列图。</li>
    </ul>
    <blockquote>给印刷厂一律导 CMYK 的 PDF，文字离出血边至少 5mm。RGB 直接印，颜色会偏。</blockquote>
    <h2>规范</h2>
    <p>标签尺寸固定一种，Logo 位置固定，以后换款只改文字，不重排版。</p>
