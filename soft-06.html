    <h1>北京精雕 ArtForm 入门：珠宝玉石浮雕编程</h1>
    <p>做绿松石、玉石浮雕，北京精雕是绕不开的。它负责把图变成机床能跑的刀路。</p>
    <h2>基本流程</h2>
    <ul>
      <li>导入手绘/扫描图，描出轮廓；</li>
      <li>做浮雕曲面，定高低层次；</li>
      <li>选刀、生成刀路，模拟一遍再出机。</li>
    </ul>
    <blockquote>玉石料硬，下刀量要小、分层多；绿松石偏脆，刀要锋利、转速匹配。不同料的刀路参数不能照搬。</blockquote>
    <h2>新手建议</h2>
    <p>先在废料上试刀路，确认深度和走向，再上真料。首件必看。</p>
